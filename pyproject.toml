[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vault-db"
version = "2.0.0"
description = "Zero-Trust Database Security Middleware & Cryptographic Audit Ledger powered by immudb & PostgreSQL"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "VaultDB Core Engineering", email = "security@vaultdb.internal" }
]
keywords = [
    "database-security",
    "immudb",
    "audit-ledger",
    "cryptographic-verification",
    "postgresql",
    "rbac",
    "row-level-security",
    "data-masking",
    "anomaly-detection",
    "compliance",
    "gdpr",
    "hipaa",
    "pci-dss"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Security :: Cryptography",
    "Topic :: Database",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "immudb-py>=1.5.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "reportlab>=4.0.0",
    "pillow>=10.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]


